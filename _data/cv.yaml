          - Established waveform-processing workflows and a performance database for dark
            count, gain, and afterpulse evaluation; characterized more than 160 R11410
            and 500 R12699 PMTs at ambient and low temperatures.
          - Evaluated rigid-flex PMT bases and informed trace-spacing and ground-isolation
            improvements. Noise and attenuation fell to about 1/5 and 1/3 of their original
            levels; average crosstalk fell from 15–20% to about 1%, and maximum crosstalk
            from 28% to below 3%.
          - Measured nonlinear PMT response over approximately 1–100,000 PE per channel
            and pulse separations of 5–100 μs; co-first author of the R12699 base study
            in IEEE Transactions on Nuclear Science.
          - Developed a coupled base-circuit and custom 2.5D electron-transport diagnostic
            model for saturation and suppression.
          - Applied waveform corrections to detector data; using the same event selection
            before and after correction, reduced the difference between multi-site and
            single-site reconstructed energy peak positions by 85%.
          - Led hardware, DAQ, calibration, Geant4 optical simulation, and reconstruction
            analysis for a 55-channel R11410 array; achieved approximately 0.66 mm overall
            spatial resolution in array performance tests.
